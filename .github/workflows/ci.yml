name: CI and local deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests without a live Gemini key
        run: python manage.py test
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker build --platform linux/amd64 -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" .
      - name: Smoke test the container
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker run -d --name ai-agent-ci -p 127.0.0.1:8000:8000 "$IMAGE:${GITHUB_SHA}"
          trap 'docker logs ai-agent-ci; docker rm -f ai-agent-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, ai-agent-deploy]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - name: Check Docker
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and deploy the tested image
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          DEPLOY_IMAGE: ${{ needs.test.outputs.image }}:${{ github.sha }}
        run: ./scripts/deploy.ps1 -Image $env:DEPLOY_IMAGE
